[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "naturepath"
version = "0.1.0"
description = "Local NaturePath hardware calibration tools"
requires-python = ">=3.11"
dependencies = ["Flask==3.1.3", "smbus2>=0.5,<1"]

[project.optional-dependencies]
dht = ["adafruit-circuitpython-dht>=4,<5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
naturepath = ["templates/*.html", "static/*.css", "static/*.js"]
